services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: scrumban
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: scrumban_prod
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scrumban -d scrumban_prod"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: scrumban-app:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Two roles intentionally: `scrumban` is SUPERUSER (created by the
      # postgres image from POSTGRES_USER) and needed for migrations
      # (CREATE/ALTER/DROP/GRANT). `scrumban_app` is non-SUPERUSER with
      # NOBYPASSRLS (created by db/init/02_create_app_role.sh) and used
      # at runtime so RLS policies actually enforce tenant isolation —
      # PostgreSQL bypasses RLS unconditionally for SUPERUSER regardless
      # of NOBYPASSRLS, so the app MUST NOT connect as `scrumban`.
      DATABASE_URL_ADMIN: postgresql://scrumban:${POSTGRES_PASSWORD}@db:5432/scrumban_prod
      DATABASE_URL: postgresql://scrumban_app:${POSTGRES_PASSWORD}@db:5432/scrumban_prod
      NUXT_DATABASE_URL: postgresql://scrumban_app:${POSTGRES_PASSWORD}@db:5432/scrumban_prod
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD}
      SENTRY_DSN: ${SENTRY_DSN:-}
      APP_URL: ${APP_URL:-https://${DOMAIN}}
      SES_ACCESS_KEY_ID: ${SES_ACCESS_KEY_ID:-}
      SES_SECRET_ACCESS_KEY: ${SES_SECRET_ACCESS_KEY:-}
      SES_REGION: ${SES_REGION:-ru-central1}
      SES_ENDPOINT: ${SES_ENDPOINT:-https://postbox.cloud.yandex.net}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Такт <noreply@takt34.tech>}
      LEADS_NOTIFY_EMAIL: ${LEADS_NOTIFY_EMAIL:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 40s
    networks:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - backend

networks:
  backend:

volumes:
  pgdata:
  caddy_data:
  caddy_config:
