name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into VM, pull, deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e
            cd ~/scrumban_app

            PREV=$(git rev-parse HEAD)
            git pull --ff-only
            CURR=$(git rev-parse HEAD)

            if [ "$PREV" = "$CURR" ]; then
              CHANGED=""
              echo "[deploy] HEAD unchanged — recreating containers without build"
            else
              CHANGED=$(git diff --name-only "$PREV" "$CURR")
              echo "[deploy] changed files:"
              echo "$CHANGED" | sed 's/^/  /'
            fi

            if [ -n "$CHANGED" ] && echo "$CHANGED" | grep -qE '^(Dockerfile|package\.json|bun\.lock|nuxt\.config\.ts|tsconfig\.json|app/|server/|shared/|scripts/|drizzle/|db/)'; then
              echo "[deploy] runtime artefacts touched → rebuilding image"
              docker compose -f docker-compose.prod.yml up -d --build
            else
              echo "[deploy] config-only change → recreating without build"
              docker compose -f docker-compose.prod.yml up -d
            fi

            docker image prune -f
            docker compose -f docker-compose.prod.yml ps
